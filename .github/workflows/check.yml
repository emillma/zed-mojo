name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
          targets: wasm32-wasip2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.26.12

      - name: Check out pinned Mojo grammar
        shell: bash
        run: |
          grammar_repository=$(python3 -c 'import tomllib; print(tomllib.load(open("extension.toml", "rb"))["grammars"]["mojo"]["repository"])')
          grammar_revision=$(python3 -c 'import tomllib; print(tomllib.load(open("extension.toml", "rb"))["grammars"]["mojo"]["rev"])')
          git init /tmp/mojo-grammar
          git -C /tmp/mojo-grammar remote add origin "$grammar_repository"
          git -C /tmp/mojo-grammar fetch --depth 1 origin "$grammar_revision"
          git -C /tmp/mojo-grammar checkout --detach FETCH_HEAD

      - name: Install grammar dependencies
        working-directory: /tmp/mojo-grammar
        run: npm ci

      - name: Install CLI dependencies
        run: python3 -m pip install typer

      - name: Validate extension
        env:
          GRAMMAR_DIR: /tmp/mojo-grammar
        run: python3 scripts/cli.py check-all
